name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Every SVG is vetted (no script, no external reference), every variant has a
      # file and a source, every licence is allowed, nothing is orphaned.
      - run: npm run check
